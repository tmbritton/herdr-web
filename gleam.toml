name = "herdr_web"
version = "0.1.0"
description = "A mobile-friendly browser bridge to persistent Herdr terminal panes"
target = "erlang"
gleam = ">= 1.19.0"

[dependencies]
gleam_stdlib = ">= 1.1.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
erlexec = ">= 2.6.0 and < 3.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

[dev-dependencies]
exception = ">= 2.1.1 and < 3.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleeunit = ">= 1.11.0 and < 2.0.0"
