<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Herdr Web Terminal Bridge</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <header>
      <h1>Herdr Web</h1>
      <nav id="pane-nav" aria-label="Pane navigation">
        <button id="previous" aria-label="Previous pane" disabled>←</button>
        <label id="position" for="picker">Loading panes…</label>
        <button id="next" aria-label="Next pane" disabled>→</button>
      </nav>
      <select id="picker" aria-label="Choose pane"></select>
      <button id="refresh">Refresh panes</button>
      <details>
        <summary>Pane ID</summary>
        <form id="attach">
          <label
            >Pane
            <input
              id="pane"
              placeholder="w1:p1"
              required
              pattern="w[1-9][0-9]*:p[1-9][0-9]*" /></label
          ><button>Watch</button>
        </form>
      </details>
      <span id="discovery" role="status"></span>
      <span id="status" role="status">Choose a pane to watch</span>
      <div id="ownership">
        <span id="mode-status">Watch mode</span>
        <button id="control" disabled>Take control</button>
        <button id="takeover" hidden>Take over</button>
        <button id="release" disabled>Release</button>
        <button id="fit" disabled>Fit terminal</button>
      </div>
    </header>
    <main id="viewport"><div id="terminal"></div></main>
  </body>
</html>
