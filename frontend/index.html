<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Herdr Web Terminal Bridge</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <header>
      <h1>Herdr Web</h1>
      <form id="attach">
        <label
          >Pane
          <input
            id="pane"
            placeholder="w1:p1"
            required
            pattern="w[1-9][0-9]*:p[1-9][0-9]*" /></label
        ><button>Watch</button>
      </form>
      <span id="status" role="status">Choose a pane to watch</span>
    </header>
    <main id="viewport"><div id="terminal"></div></main>
  </body>
</html>
