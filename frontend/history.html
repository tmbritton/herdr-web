<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full session history · Herdr</title>
    <link rel="stylesheet" href="/assets/history.css" />
    <script type="module" src="/assets/history.js"></script>
  </head>
  <body>
    <header>
      <a href="/">Terminal</a>
      <h1 id="history-title">Full session history</h1>
      <p id="history-status" role="status">Loading history…</p>
      <nav aria-label="Transcript pages">
        <button data-action="Beginning">Beginning</button>
        <button data-action="Older">Older</button>
        <button data-action="Newer">Newer</button>
        <button data-action="Latest">Latest</button>
      </nav>
    </header>
    <main id="transcript" aria-label="Session transcript" tabindex="0"></main>
  </body>
</html>
