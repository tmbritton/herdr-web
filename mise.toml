[tools]
gleam = "1.19.2"
erlang = "29.1.1"
rebar = "3.28.0"
node = "26.7.0"

[tasks.dev]
description = "Run the bridge on http://127.0.0.1:3000"
depends = ["assets"]
run = "gleam run"

[tasks.build]
description = "Compile the application"
depends = ["assets"]
run = "gleam build"

[tasks.format]
description = "Format Gleam source"
run = ["gleam format src test", "npm run format"]

[tasks.check]
description = "Check formatting, types, and compiler warnings"
run = ["gleam format --check src test", "gleam check", "gleam build --warnings-as-errors", "bash scripts/check-erlang.sh", "npm run check"]

[tasks.lint]
description = "Run Gleam's compiler lint checks (warnings are errors)"
run = "gleam build --warnings-as-errors"

[tasks."hooks:install"]
description = "Install the repository's pre-commit checks"
run = "bash scripts/install-hooks.sh"

[tasks.test]
description = "Run the test suite"
depends = ["assets"]
run = ["gleam test", "npm test"]

[tasks.assets]
description = "Bundle the browser terminal"
run = "npm run build"

[tasks.export]
description = "Build a production Erlang shipment"
depends = ["assets"]
run = "gleam export erlang-shipment"

[tasks."service:install"]
description = "Export and install a user service (does not start it)"
depends = ["export"]
run = "bash scripts/install-service.sh"

[tasks."service:start"]
description = "Enable the installed service at login/boot and start it"
run = "systemctl --user enable --now herdr-web.service"

[tasks."service:stop"]
description = "Stop the installed service"
run = "systemctl --user stop herdr-web.service"

[tasks."service:logs"]
description = "Follow the service journal"
run = "journalctl --user -u herdr-web.service -f"
